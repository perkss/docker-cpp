name: CMake Build Matrix

on: [push, pull_request]

env:
  CMAKE_VERSION: 4.2.1
  NINJA_VERSION: 1.11.1
  BUILD_TYPE: Release
  CCACHE_VERSION: 4.7.3
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:
  macos-native-x86_64:
    name: "macOS Debug (Intel)"
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout submodules
        run: git submodule update --init --recursive
      - name: Install Homebrew packages
        run: |
          brew install cmake boost spdlog nlohmann-json llvm curl ninja
      - name: Build Debug
        run: |
          CMAKE_POLICY_VERSION_MINIMUM=4.2.1 cmake -DCMAKE_BUILD_TYPE=Debug -G Ninja -S . -B build
          CMAKE_POLICY_VERSION_MINIMUM=4.2.1 cmake --build build
      - name: Run tests
        run: |
          CMAKE_POLICY_VERSION_MINIMUM=4.2.1 cmake --build build -t test

  build:
    name: "Ubuntu Debug"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout submodules
        run: git submodule update --init --recursive
      - name: Create build directory and run CMake
        run: |
          sudo apt-get -y update
          sudo apt-get install -y build-essential cmake g++-10 gcc-10 libgtest-dev make libssl-dev python3-dev autotools-dev libicu-dev libbz2-dev libboost-all-dev libspdlog-dev nlohmann-json3-dev llvm curl libcurl4-openssl-dev ninja-build
          ls
          g++ --version
          pip install --upgrade cmake
          CMAKE_POLICY_VERSION_MINIMUM=4.2.1 cmake -DCMAKE_BUILD_TYPE=Debug -G Ninja -S . -B build
          CMAKE_POLICY_VERSION_MINIMUM=4.2.1 cmake --build build
          CMAKE_POLICY_VERSION_MINIMUM=4.2.1 cmake --build build -t test

  ubuntu-release:
    name: "Ubuntu Release"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout submodules
        run: git submodule update --init --recursive
      - name: Create build directory and build Release
        run: |
          sudo apt-get -y update
          sudo apt-get install -y build-essential cmake g++-10 gcc-10 libgtest-dev make libssl-dev python3-dev autotools-dev libicu-dev libbz2-dev libboost-all-dev libspdlog-dev nlohmann-json3-dev llvm curl libcurl4-openssl-dev ninja-build
          pip install --upgrade cmake
          CMAKE_POLICY_VERSION_MINIMUM=4.2.1 cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -G Ninja -S . -B build
          CMAKE_POLICY_VERSION_MINIMUM=4.2.1 cmake --build build
      - name: Create install directory
        run: |
          CMAKE_POLICY_VERSION_MINIMUM=4.2.1 cmake --install build --prefix install
      - name: Upload Release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-release-artifacts
          path: install/
          retention-days: 7

  macos-release-x86_64:
    name: "macOS Release (Intel)"
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout submodules
        run: git submodule update --init --recursive
      - name: Install Homebrew packages
        run: |
          brew install cmake boost spdlog nlohmann-json llvm curl ninja
      - name: Build Release
        run: |
          CMAKE_POLICY_VERSION_MINIMUM=4.2.1 cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -G Ninja -S . -B build
          CMAKE_POLICY_VERSION_MINIMUM=4.2.1 cmake --build build
      - name: Create install directory
        run: |
          CMAKE_POLICY_VERSION_MINIMUM=4.2.1 cmake --install build --prefix install
      - name: Upload Release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-artifacts
          path: install/
          retention-days: 7
